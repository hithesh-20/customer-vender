name: vendor_saathi
description: AI-Driven Voice Commerce & Intelligent Mobility Platform for Vendors
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9

  # UI & Design
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0

  # Navigation
  go_router: ^13.0.0

  # Local Storage & Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # Network & API
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  internet_connection_checker: ^1.0.0+1

  # Authentication
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  google_sign_in: ^6.1.5
  flutter_facebook_auth: ^5.0.11

  # GPS & Location
  geolocator: ^10.0.0
  google_maps_flutter: ^4.3.0
  location_permissions: ^4.0.1
  flutter_polyline_points: ^1.0.0

  # Voice & Speech
  speech_to_text: ^6.1.0
  flutter_tts: ^3.6.3
  avatars: ^3.0.1

  # Payments
  razorpay_flutter: ^1.3.5
  upi_india: ^3.0.0

  # Images & Camera
  image_picker: ^1.0.4
  camera: ^0.10.5+9
  file_picker: ^5.3.3

  # Date & Time
  intl: ^0.18.1
  date_time_picker: ^2.1.0
  table_calendar: ^3.0.9

  # Charts & Analytics
  fl_chart: ^0.63.0
  syncfusion_flutter_charts: ^23.1.40

  # Notifications
  flutter_local_notifications: ^16.1.2
  firebase_messaging: ^14.7.0

  # Weather
  weather: ^3.0.0

  # Offline Sync
  workmanager: ^0.5.1
  background_fetch: ^1.1.0

  # Utilities
  uuid: ^4.2.1
  equatable: ^2.0.5
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Icons
  cupertino_icons: ^1.0.6
  flutter_feather_icons: ^2.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/animations/
    - assets/voice/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: NotoSansKannada
      fonts:
        - asset: assets/fonts/NotoSansKannada-Regular.ttf
        - asset: assets/fonts/NotoSansKannada-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansKannada-Bold.ttf
          weight: 700
